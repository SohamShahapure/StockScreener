# Render Blueprint for the AI Stock Screener backend — FREE TIER.
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint",
# point it at the repo. Render reads this file and provisions everything at $0.
#
# It creates:
#   - a free Python web service running the FastAPI backend (rootDir: backend)
#   - a free managed PostgreSQL database, wired into DATABASE_URL automatically
#
# Free-tier realities (all fine for a portfolio demo):
#   - The web service sleeps after ~15 min idle; the next request cold-starts
#     it (~30-60s). Subsequent requests are fast.
#   - No persistent disk on free tier, so the ChromaDB index lives on the
#     ephemeral filesystem and is rebuilt on demand after a restart. The
#     embedding model is ONNX/all-MiniLM (no PyTorch), which fits in the
#     512MB free instance and re-downloads (~80MB) after a cold start.
#   - The free Postgres database expires after ~90 days (Render emails you).
#
# SECRETS to set in the Render dashboard (marked sync:false, NOT stored in git):
#   - GROQ_API_KEY : your Groq key (console.groq.com/keys)
#   - CORS_ORIGINS : https://<your-vercel-app>.vercel.app   (a plain URL is fine)
#   - NEWS_API_KEY : optional, for the news tab (newsapi.org)

services:
  - type: web
    name: stockscreener-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Auth token signing key - Render generates a strong random value.
      - key: SECRET_KEY
        generateValue: true
      # LLM: Groq (fast, hosted - no local memory needed). Set the key below.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.1"
      # Your Vercel frontend origin, e.g. ["https://tickerboom.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Optional integrations
      - key: NEWS_API_KEY
        sync: false
      # Postgres connection string, injected from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: stockscreener-db
          property: connectionString
      # Ephemeral on free tier - the KB rebuilds on demand after a restart.
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: stockscreener-db
    plan: free
    databaseName: stock_screener
    user: stock_screener
